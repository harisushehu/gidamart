[tool:pytest]
testpaths = tests
addopts = -q

[mypy]
python_version = 3.9
ignore_missing_imports = True
follow_imports = silent
check_untyped_defs = False
warn_unused_ignores = False

# Flask-SQLAlchemy creates db.Model at runtime, which mypy cannot see.
[mypy-src.models.*]
disable_error_code = name-defined

[mypy-src.models]
disable_error_code = name-defined

[mypy-pymysql.*]
ignore_missing_imports = True
