{% extends "base.html" %}

{% block title %}Page Not Found - Gidamart{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="card shadow">
                <div class="card-body py-5">
                    <div class="mb-4">
                        <i class="bi bi-exclamation-triangle text-warning" style="font-size: 4rem;"></i>
                    </div>
                    <h1 class="display-4 mb-3">404</h1>
                    <h2 class="mb-4">Page Not Found</h2>
                    <p class="lead mb-4">
                        The page you're looking for doesn't exist or has been moved.
                    </p>
                    <div class="d-grid gap-2 d-md-block">
                        <a href="{{ url_for('public.home') }}" class="btn btn-primary btn-lg">
                            <i class="bi bi-house"></i> Go Home
                        </a>
                        <a href="{{ url_for('public.properties') }}" class="btn btn-outline-primary btn-lg">
                            <i class="bi bi-building"></i> Browse Properties
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
